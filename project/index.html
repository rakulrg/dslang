    <!-- Hero loading state. The hero's loading state is its own dark DSLANG
         treatment (see .hero-shell / .hero-curtain in src/index.css), which
         fades out as the photograph fades in once it has decoded. There is no
         blurred preview, no LQIP and no skeleton.

         The --hero-lqip custom property below is intentionally `none` and is
         NOT referenced by any stylesheet: the blurred preview was removed from
         the hero's visual. The property and its markers are kept only because
         scripts/generate-hero-lqip.mjs rewrites between them (it still
         regenerates src/lib/heroLqip.generated.ts for the runtime cache), and
         it errors out if the markers are missing. Nothing paints it. -->
    <style>
      /*HERO_LQIP_START*/:root{--hero-lqip:none;}/*HERO_LQIP_END*/
    </style>
