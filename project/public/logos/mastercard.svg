<!--
  Mastercard Symbol - Light Background, from the official Mastercard Brand Center
  (mastercard.com/brandcenter -> Download Artwork -> Mastercard Symbol -> SVG).
  Official artwork: "ma_symbol.svg". Geometry, colours (#EB001B / #FF5F00 /
  #F79E1B) and paint order are unmodified.

  The only change is the viewBox: the official artboard is 0 0 152.4 108, whose
  ~12% transparent margin makes the mark read smaller than its neighbours when
  every logo in a row is set to the same height. 17.8 18 116.6 72.1 is the
  artwork's own tight ink bounding box, so "22px tall" means 22px of visible ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.8 18 116.6 72.1" role="img" aria-label="Mastercard">
  <path fill="#EB001B" d="M62.4 54c0-11 5.1-21.5 13.7-28.3-15.6-12.3-38.3-9.6-50.6 6.1C13.3 47.4 16 70 31.7 82.3c13.1 10.3 31.4 10.3 44.5 0C67.5 75.5 62.4 65 62.4 54Z"/>
  <rect x="60.4" y="25.7" width="31.5" height="56.6" fill="#FF5F00"/>
  <path fill="#F79E1B" d="M134.4 54c0 19.9-16.1 36-36 36-8.1 0-15.9-2.7-22.2-7.7 15.6-12.3 18.3-34.9 6-50.6-1.8-2.2-3.8-4.3-6-6 15.6-12.3 38.3-9.6 50.5 6.1C131.7 38.1 134.4 45.9 134.4 54Z"/>
</svg>
